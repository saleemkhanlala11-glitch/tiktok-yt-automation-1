<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="24 16" opacity="0.6"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="12 12" opacity="0.4"/>
  
  <!-- YouTube Shorts / Rocket Icon Central Badge -->
  <rect x="136" y="156" width="240" height="200" rx="46" fill="url(#ytGrad)" filter="url(#glow)"/>
  
  <!-- Play Triangle -->
  <polygon points="230,216 304,256 230,296" fill="#ffffff"/>
  
  <!-- Automation Pulse Nodes -->
  <circle cx="256" cy="76" r="14" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="436" cy="256" r="14" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="436" r="14" fill="#8b5cf6" filter="url(#glow)"/>
  <circle cx="76" cy="256" r="14" fill="#f59e0b" filter="url(#glow)"/>
</svg>
