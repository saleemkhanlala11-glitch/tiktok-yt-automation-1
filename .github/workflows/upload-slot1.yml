name: Upload Slot 1

on:
  schedule:
    # Slot 1 publish time: 17:00 UTC (7 PM CEST)
    - cron: '0 17 * * *'
    # Retry slot (+90m fresh IP): 18:30 UTC
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel ID'
        required: false
        default: 'channel_1'
      dry_run:
        description: 'Dry run (do not upload to YouTube)'
        type: boolean
        required: false
        default: false

concurrency:
  group: upload-channel_1
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore credentials from secrets
        env:
          CLIENT_SECRET_B64: ${{ secrets.CHANNEL_1_CLIENT_SECRET }}
          TOKEN_B64: ${{ secrets.CHANNEL_1_TOKEN }}
          COOKIES_B64: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          mkdir -p credentials tokens downloads logs
          if [ -n "$CLIENT_SECRET_B64" ]; then
            echo "$CLIENT_SECRET_B64" | base64 -d > credentials/channel_1_client_secret.json
          fi
          if [ -n "$TOKEN_B64" ]; then
            echo "$TOKEN_B64" | base64 -d > tokens/channel_1_token.json
          fi
          if [ -n "$COOKIES_B64" ]; then
            echo "$COOKIES_B64" | base64 -d > cookies.txt
            export TIKTOK_COOKIES_FILE=cookies.txt
          fi

      - name: Run Slot 1
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          CHANNEL_NAME="${{ inputs.channel || 'channel_1' }}"
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python run.py --slot 1 --channel "$CHANNEL_NAME" $DRY_RUN_FLAG

      - name: Commit database state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            git add data/
            if git diff --staged --quiet; then
              echo "No database changes to commit."
              break
            else
              git commit -m "chore(db): update channel database [skip ci]"
              if git push origin main; then
                echo "Database pushed successfully."
                break
              fi
              echo "Push collision, retrying in 3s..."
              sleep 3
            fi
          done

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slot1-logs
          path: logs/
          retention-days: 14
